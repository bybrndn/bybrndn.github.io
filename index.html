    :root {
      --bg: #16181f;
      --card: #eceef2;
      --dark: #13141a;
      --text: #eceef2;
      --muted: #666;
      --border: rgba(0,0,0,0.07);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      padding: 2.2rem 5vw 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }

    .header-by {
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      font-size: 0.85rem;
      letter-spacing: 0.35em;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
    }

    .header-logo {
      color: var(--text);
      display: flex;
      align-items: center;
    }

    .header-logo svg {
      height: 28px;
      width: auto;
    }

    .header-rule {
      display: block;
      width: 55%;
      max-width: 700px;
      margin: 0 auto;
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    /* ── HERO ── */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      max-width: 1200px;
      margin: 3.5rem auto 0;
      padding: 0 5vw;
      align-items: end;
      min-height: 460px;
    }

    .hero-photo-wrap {
      position: relative;
      z-index: 1;
    }

    .hero-photo-wrap img {
      width: 100%;
      display: block;
      object-fit: cover;
      aspect-ratio: 4/3;
      filter: brightness(0.9) contrast(1.06) saturate(0.8);
    }

    .hero-photo-wrap::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 100px; height: 100%;
      background: linear-gradient(to right, transparent, var(--card));
      pointer-events: none;
    }

    .hero-card {
      background: var(--card);
      padding: 4rem 4rem 4rem 3.5rem;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.4rem;
      height: 100%;
    }

    .hero-title {
      font-family: 'Grandspan Wide', sans-serif;
      font-size: clamp(3.2rem, 5.5vw, 5.8rem);
      color: var(--dark);
      line-height: 0.95;
      letter-spacing: -0.01em;
    }

    .hero-desc {
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem;
      font-weight: 400;
      color: #555;
      line-height: 1.7;
      max-width: 340px;
    }

    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--dark);
      color: var(--text);
      text-decoration: none;
      font-family: 'Poppins', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      padding: 0.85rem 1.8rem;
      width: fit-content;
      transition: background 0.2s, gap 0.2s;
    }

    .hero-btn:hover { background: #000; gap: 1rem; }
    .hero-btn span { font-size: 1rem; }

    /* ── CONTACT GRID ── */
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 5vw;
    }

    .contact-cell {
      background: var(--card);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem 3.5rem;
      gap: 0.55rem;
      border-left: 1px solid var(--border);
    }

    .contact-cell:first-of-type { border-left: none; }

    .contact-icon svg {
      width: 26px;
      height: 26px;
      stroke: #333;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-bottom: 0.3rem;
    }

    .contact-label {
      font-family: 'Grandspan Wide', sans-serif;
      font-size: 1.15rem;
      color: var(--dark);
      letter-spacing: 0.04em;
    }

    .contact-value {
      font-family: 'Poppins', sans-serif;
      font-size: 0.82rem;
      color: #666;
      text-decoration: none;
      transition: color 0.2s;
    }

    .contact-value:hover { color: var(--dark); }

    .socials-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.15rem;
    }

    .social-btn {
      width: 34px;
      height: 34px;
      background: var(--dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
    }

    .social-btn:hover { opacity: 0.75; transform: scale(1.08); }

    .social-btn svg {
      width: 14px;
      height: 14px;
      fill: white;
      stroke: none;
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 2.5rem 2rem;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.18);
      text-transform: uppercase;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .hero { grid-template-columns: 1fr; margin-top: 2rem; }
      .hero-photo-wrap::after { display: none; }
      .hero-card { padding: 2.5rem 1.8rem 3rem; }
      .contact-grid { grid-template-columns: 1fr; padding: 0 5vw; }
      .contact-cell { border-left: none; border-top: 1px solid var(--border); }
      .contact-cell:first-of-type { border-top: none; }
    }
  </style>
</head>
