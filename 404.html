  <link rel="stylesheet" href="/style.css" />
  <style>
    .not-found {
      min-height: calc(100vh - 80px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
    }

    .nf-left {
      padding: 5vw 4vw 5vw 3.5vw;
      border-right: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .nf-tag {
      font-size: 0.58rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--ink-mid);
      font-weight: 600;
    }

    .nf-title {
      font-family: 'Grandspan Wide', sans-serif;
      font-size: clamp(6rem, 18vw, 18rem);
      line-height: 0.85;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    .nf-bottom {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .nf-desc {
      font-size: 0.82rem;
      line-height: 1.9;
      color: var(--ink-mid);
      font-weight: 500;
      max-width: 320px;
    }

    .nf-actions {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }

    .nf-right {
      padding: 5vw 3.5vw 5vw 4vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 0;
    }

    .nf-suggestions {
      width: 100%;
    }

    .nf-suggestion {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.8rem 0;
      border-bottom: 1px solid var(--rule);
      text-decoration: none;
      transition: padding-left 0.3s var(--ease);
    }
    .nf-suggestion:first-child { border-top: 1px solid var(--rule); }
    .nf-suggestion:hover { padding-left: 1rem; }

    .ns-label {
      font-size: 0.58rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--ink-mid);
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .ns-title {
      font-family: 'Grandspan Wide', sans-serif;
      font-size: clamp(1.2rem, 2.2vw, 2rem);
      color: var(--ink);
      line-height: 1;
    }

    .ns-arrow {
      font-size: 1rem;
      color: var(--ink-mid);
      transition: transform 0.25s var(--ease), color 0.2s;
    }
    .nf-suggestion:hover .ns-arrow { transform: translate(4px, -4px); color: var(--ink); }

    @media (max-width: 860px) {
      .not-found { grid-template-columns: 1fr; }
      .nf-left { border-right: none; border-bottom: 1px solid var(--rule); padding-right: 3.5vw; padding-bottom: 4vw; }
      .nf-right { padding-left: 3.5vw; }
      .nf-title { font-size: clamp(5rem, 22vw, 10rem); }
    }
  </style>
</head>
