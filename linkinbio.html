<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BY BRNDN — Links</title>
  <link rel="icon" href="/images/BRNDN favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />

  <style>
    /* ── LINK IN BIO PAGE ── */
    .bio-page {
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem 3rem;
    }

    .bio-wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── PROFILE ── */
    .bio-profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      padding-bottom: 2.5rem;
      text-align: center;
    }

    .bio-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid var(--rule);
    }

    .bio-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      filter: grayscale(10%) contrast(1.06);
      display: block;
    }

    .bio-name {
      font-family: 'Grandspan Wide', sans-serif;
      font-size: clamp(2rem, 9vw, 2.6rem);
      line-height: 0.9;
      letter-spacing: -0.025em;
      color: var(--ink);
    }

    .bio-handle {
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink-mid);
      margin-top: 0.35rem;
    }

    .bio-desc {
      font-size: 0.73rem;
      line-height: 1.9;
      color: var(--ink-mid);
      max-width: 260px;
    }

    /* ── LINKS ── */
    .bio-links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .bio-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.15rem 1.4rem;
      border: 1px solid var(--rule);
      text-decoration: none;
      color: var(--ink);
      position: relative;
      overflow: hidden;
      transition: transform 0.25s var(--ease);
    }

    .bio-link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--ink);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.45s var(--ease);
      z-index: 0;
    }

    .bio-link:hover::before { transform: scaleX(1); }
    .bio-link:hover { transform: translateY(-1px); }
    .bio-link:hover .bl-label,
    .bio-link:hover .bl-sub,
    .bio-link:hover .bl-arrow { color: var(--bg); }

    .bl-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      position: relative;
      z-index: 1;
    }

    .bl-icon {
      width: 32px;
      height: 32px;
      border: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.3s;
    }
    .bio-link:hover .bl-icon { border-color: rgba(21,24,30,0.2); }

    .bl-icon svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      color: var(--ink-mid);
      transition: color 0.3s;
    }
    .bio-link:hover .bl-icon svg { color: var(--bg); }

    .bl-text { display: flex; flex-direction: column; gap: 0.1rem; }

    .bl-label {
      font-size: 0.73rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--ink);
      transition: color 0.3s;
      line-height: 1.2;
    }

    .bl-sub {
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-mid);
      transition: color 0.3s;
    }

    .bl-arrow {
      font-size: 0.85rem;
      color: var(--ink-mid);
      position: relative;
      z-index: 1;
      transition: color 0.3s, transform 0.3s var(--ease);
    }
    .bio-link:hover .bl-arrow { transform: translate(3px, -3px); }

    /* ── DIVIDER ── */
    .bio-divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.6rem 0;
    }
    .bio-divider-line { flex: 1; height: 1px; background: var(--rule); }
    .bio-divider-label {
      font-size: 0.5rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink-mid);
    }

    /* ── MOBILE ── */
    @media (max-width: 860px) {
      .bio-page {
        justify-content: flex-start;
        padding-top: 3rem;
      }
      .bio-link:hover { transform: none; }
      .bio-link:active::before { transform: scaleX(1); }
      .bio-link:active .bl-label,
      .bio-link:active .bl-sub,
      .bio-link:active .bl-arrow { color: var(--bg); }
    }
  </style>

</head>
