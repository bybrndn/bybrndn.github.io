<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BY BRNDN — Work</title>
  <link rel="icon" href="/images/BRNDN favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />

    <!-- Google Analytics tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JHZLX6JYBW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  
    gtag('config', 'G-JHZLX6JYBW');
  </script>
  
  <style>
    .work-big {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: clamp(3rem, 7vw, 7rem);
      letter-spacing: -0.04em;
      line-height: 0.88;
      color: var(--ink-mid);
    }
  </style>
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-ring"></div>
  <nav id="navbar"></nav>
  <div class="page">
    <div class="work-header reveal">
      <h1 class="work-big">PROJECTS</h1>
      <div class="work-header-right">
        <span class="work-count" id="workCount">Projects</span>
        <p class="work-intro">Branding, UI/UX, motion, and digital work. A growing collection.</p>
      </div>
    </div>
    <!-- Populated dynamically from /projects/projects.json + each project.json -->
    <div class="work-list" id="workList"></div>
    <footer>
      <span>© 2026 Branden Hall</span>
      <span>Auckland, NZ</span>
    </footer>
  </div>
  <script src="/script.js"></script>
  <script>
    // ── Build the work list from the project data source ──
    (function () {
      var PRETTY = !location.pathname.endsWith('.html');
      function purl(slug) {
        return (PRETTY ? '/projects/project/?p=' : '/projects/project.html?p=') + encodeURIComponent(slug);
      }
      var list = document.getElementById('workList');
      var countEl = document.getElementById('workCount');

      fetch('/projects/projects.json', { cache: 'no-cache' })
        .then(function (r) { return r.json(); })
        .then(function (slugs) {
          return Promise.all(slugs.map(function (slug) {
            return fetch('/projects/' + slug + '/project.json', { cache: 'no-cache' })
              .then(function (r) { return r.ok ? r.json() : null; })
              .then(function (d) { return d ? { slug: slug, data: d } : null; })
              .catch(function () { return null; });
          }));
        })
        .then(function (items) {
          items = items.filter(Boolean);
          if (countEl) countEl.textContent = String(items.length).padStart(2, '0') + (items.length === 1 ? ' Project' : ' Projects');
          list.innerHTML = items.map(function (it, i) {
            var d = it.data;
            var num = String(i + 1).padStart(2, '0');
            var title = d.listTitle || d.title;
            var type = d.subtitle || (d.meta && d.meta[0] && d.meta[0].value) || '';
            return '<a class="work-item reveal" href="' + purl(it.slug) + '">' +
              '<span class="wi-num">' + num + '</span>' +
              '<div class="wi-center"><span class="wi-title">' + title + '</span>' +
              '<span class="wi-type">' + type + '</span></div>' +
              '<span class="wi-arrow">↗</span></a>';
          }).join('');

          // Reveal-on-scroll for the freshly built items.
          var obs = new IntersectionObserver(function (es) {
            es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
          }, { threshold: 0.08 });
          list.querySelectorAll('.reveal').forEach(function (el) {
            if (el.getBoundingClientRect().top < window.innerHeight) el.classList.add('visible');
            else obs.observe(el);
          });
          var ring = document.querySelector('.cursor-ring');
          if (ring) list.querySelectorAll('a').forEach(function (el) {
            el.addEventListener('mouseenter', function () { ring.classList.add('grow'); });
            el.addEventListener('mouseleave', function () { ring.classList.remove('grow'); });
          });
        })
        .catch(function () {
          list.innerHTML = '<p class="work-intro" style="padding:2rem 0">Unable to load projects.</p>';
        });
    })();
  </script>
</body>
</html>
